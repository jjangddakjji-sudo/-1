<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>비밀 사진첩 - 친구 A</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
    body { background-color: #f5f5f7; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
    
    /* 비밀번호 잠금 화면 */
    #lockScreen {
      background: white; padding: 32px; border-radius: 20px; text-align: center;
      box-shadow: 0 10px 25px rgba(0,0,0,0.08); width: 100%; max-width: 360px;
    }
    #lockScreen h2 { font-size: 1.2rem; margin-bottom: 16px; color: #333; }
    #lockScreen input {
      width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 10px;
      font-size: 1rem; margin-bottom: 12px; text-align: center; outline: none;
    }
    #lockScreen button {
      width: 100%; padding: 12px; background: #007aff; color: white; border: none;
      border-radius: 10px; font-weight: bold; cursor: pointer; font-size: 1rem;
    }

    /* 사진첩 화면 */
    #galleryScreen {
      display: none; background: white; padding: 24px; border-radius: 24px;
      width: 100%; max-width: 480px; box-shadow: 0 10px 30px rgba(0,0,0,0.08);
    }
    .header { text-align: center; margin-bottom: 24px; }
    .header h1 { font-size: 1.5rem; color: #1d1d1f; margin-bottom: 6px; }
    .header p { color: #86868b; font-size: 0.9rem; }
    
    .photo-card {
      background: #fafafa; border-radius: 16px; overflow: hidden;
      border: 1px solid #eee; margin-bottom: 20px;
    }
    .photo-card img { width: 100%; height: auto; display: block; }
    .photo-card .caption { padding: 16px; font-size: 0.95rem; line-height: 1.5; color: #333; }
    
    .back-btn {
      display: block; text-align: center; margin-top: 20px; text-decoration: none;
      color: #007aff; font-weight: 600; font-size: 0.9rem;
    }
  </style>
</head>
<body>

  <!-- 비밀번호 잠금 창 -->
  <div id="lockScreen">
    <h2>🔒 암호를 입력하세요</h2>
    <input type="password" id="pwInput" placeholder="비밀번호 입력">
    <button onclick="checkPassword()">확인</button>
  </div>

  <!-- 사진첩 내용 -->
  <div id="galleryScreen">
    <div class="header">
      <h1>추억 사진첩</h1>
      <p>우리만의 소중한 기록</p>
    </div>

    <!-- 사진 카드 1 -->
    <div class="photo-card">
      <img src="https://images.unsplash.com/photo-1511632765486-a01980e01a18?w=800" alt="사진1">
      <div class="caption">
        함께했던 즐거운 시간! 다음에 또 놀러 가자. 😄
      </div>
    </div>

    <!-- 사진 카드 2 -->
    <div class="photo-card">
      <img src="https://images.unsplash.com/photo-1492684223066-81342ee5ff30?w=800" alt="사진2">
      <div class="caption">
        맛있는 음식 먹었던 날. 기분 전환 제대로 되었던 하루!
      </div>
    </div>

    <a href="index.html" class="back-btn">← 전체 앨범 목록으로 돌아가기</a>
  </div>

  <script>
    // 설정할 비밀번호 (원하는 것으로 수정하세요)
    const SECRET_PW = "1234";

    function checkPassword() {
      const input = document.getElementById('pwInput').value;
      if (input === SECRET_PW) {
        document.getElementById('lockScreen').style.display = 'none';
        document.getElementById('galleryScreen').style.display = 'block';
      } else {
        alert('비밀번호가 올바르지 않습니다.');
      }
    }
  </script>
</body>
</html>
